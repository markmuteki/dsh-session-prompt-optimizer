name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in index.js client.js context.js upstream.js _prompt_check.mjs; do
            node --check "$f"
          done

      - name: Manifest sanity
        run: node scripts/manifest-check.mjs

      - name: Upstream template test (network, non-blocking)
        continue-on-error: true
        run: node _prompt_check.mjs
